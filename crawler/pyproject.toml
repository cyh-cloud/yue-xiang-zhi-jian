[project]
name = "yuexiang-crawler"
version = "0.1.0"
description = "Scrapy collection projects for the Yuexiang platform"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.13,<3",
]

[project.optional-dependencies]
ihchina = ["beautifulsoup4==4.13.4"]
nzrc = ["beautifulsoup4==4.13.4"]
nongmuhr = ["beautifulsoup4==4.13.4"]
dialect-org = ["beautifulsoup4==4.13.4"]
cass-linguistics = ["beautifulsoup4==4.13.4"]
feiyiw = ["beautifulsoup4==4.13.4"]
aqsc-moa = ["openpyxl==3.1.5"]
cnipa = ["pypdf==6.21.1"]

[dependency-groups]
dev = [
    "beautifulsoup4==4.13.4",
    "openpyxl==3.1.5",
    "pypdf==6.21.1",
]

[tool.uv]
package = false

[tool.uv.sources]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawler*"]
