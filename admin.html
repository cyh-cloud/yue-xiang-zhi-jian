<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理 - 粤乡智匠</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="portal.css">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ============================================================
           后台管理页外壳（2026-10-12 重做）：顶部复用前台菜单栏，品牌徽标移到
           侧栏顶部；左侧侧栏参考 new-api，桌面端可折叠成图标栏、主区随动。
           ============================================================ */
        :root {
            --admin-navbar-h: 72px;
            --admin-sidebar-w-expanded: 244px;
            --admin-sidebar-w-collapsed: 68px;
            --admin-sidebar-w: var(--admin-sidebar-w-expanded);
        }
        .admin-portal { display: block; }
        /* 折叠只改这一个变量：侧栏宽度从这里推，主区靠 flex 自动铺开 */
        .admin-portal.is-collapsed { --admin-sidebar-w: var(--admin-sidebar-w-collapsed); }

        /* ---- 顶部：复用前台菜单栏（左边栏开关 + 徽标，中间导航居中，右侧操作）---- */
        .admin-navbar .nav-container {
            position: relative; max-width: none;
            padding: 0 14px 0 16px; justify-content: center; gap: 0;
        }
        .admin-nav-left {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 8px;
        }
        .admin-navbar .nav-actions {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        }
        .admin-navbar .nav-menu { justify-content: center; }
        /* 侧栏开关：宽屏收起/展开，窄屏开合抽屉（new-api 的 SidebarTrigger 同款位置） */
        .admin-sidebar-toggle {
            width: 32px; height: 32px; flex-shrink: 0;
            border: none; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: transparent; color: var(--text-secondary); font-size: 0.95rem;
            transition: background .15s, color .15s;
        }
        .admin-sidebar-toggle:hover { background: rgba(0,0,0,.05); color: var(--text-primary); }
        .admin-sidebar-toggle i { transition: transform .2s ease-linear; }
        html[data-theme="dark"] .admin-sidebar-toggle:hover { background: rgba(255,255,255,.08); }

        /* ⚠️ portal.css 的 `.portal * { margin:0; padding:0 }` 与 styles.css 里的组件
           同为单类权重，而 portal.css 后加载 —— 门户页里凡是复用 styles.css 的组件
           （顶栏、下拉、弹窗、表单）都会整块掉 padding。这里按组件补回来。 */
        .admin-portal .nav-item { padding: 8px 14px; }
        .admin-portal .user-avatar-wrap { padding: 4px 8px; }
        .admin-portal .dropdown-header { padding: 14px 16px; }
        .admin-portal .dropdown-item { padding: 10px 16px; }
        .admin-portal .modal-header { padding: 20px 24px; }
        .admin-portal .modal-body { padding: 24px; }
        .admin-portal .form-group label { margin-bottom: 6px; }

        /* ---- 外壳：菜单栏下方一行 = 侧栏 + 主区 ---- */
        .admin-shell {
            display: flex; align-items: stretch;
            min-height: calc(100vh - var(--admin-navbar-h));
            margin-top: var(--admin-navbar-h);
        }

        /* ---- 侧栏 ---- */
        .admin-portal .admin-sidebar {
            width: var(--admin-sidebar-w);
            flex-shrink: 0;
            display: flex; flex-direction: column;
            position: sticky; top: var(--admin-navbar-h);
            height: calc(100vh - var(--admin-navbar-h));
            background: var(--portal-sidebar-bg);
            color: var(--portal-sidebar-text);
            z-index: 30;
            transition: width .2s ease-linear;
        }
        .admin-portal .admin-sidebar a { text-decoration: none; }

        /* 分组标签（new-api 的小字分组标题） */
        .admin-group-label {
            padding: 12px 14px 6px; font-size: 0.68rem; font-weight: 600;
            letter-spacing: .06em; color: var(--portal-sidebar-link); opacity: .85;
            white-space: nowrap; transition: opacity .15s ease-linear;
        }

        /* 导航项：图标 + 文字；激活项左侧一条强调色竖条。
           ⚠️ 选择器都带 .admin-portal 前缀：portal.css 里的 `.portal-sidebar nav a`
           是「类 + 元素」两级，只用 `.admin-nav a` 压不住它的 padding / border-left / 激活配色。 */
        .admin-portal .admin-nav {
            position: relative; display: flex; flex-direction: column; gap: 2px;
            padding: 14px 12px 10px; overflow: visible;
        }
        .admin-portal .admin-nav a, .admin-portal .admin-drawer-front a {
            position: relative; display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 10px; font-size: 0.9rem;
            color: var(--portal-sidebar-link); white-space: nowrap; border-left: none;
            transition: background .15s, color .15s;
        }
        .admin-portal .admin-nav a i, .admin-portal .admin-drawer-front a i {
            width: 20px; flex-shrink: 0; text-align: center; font-size: 1rem;
        }
        .admin-portal .admin-nav a > span, .admin-portal .admin-drawer-front a > span { transition: opacity .15s ease-linear; }
        .admin-portal .admin-nav a:hover, .admin-portal .admin-drawer-front a:hover {
            background: var(--portal-sidebar-link-hover-bg); color: var(--portal-sidebar-text);
        }
        .admin-portal .admin-nav a.active {
            background: var(--portal-sidebar-link-hover-bg); color: #fff; font-weight: 600;
        }
        .admin-portal .admin-nav a.active::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--portal-accent);
        }
        /* 折叠后的悬浮提示，补回被藏起来的文字 */
        .admin-portal .admin-nav a::after {
            content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%;
            transform: translateY(-50%); z-index: 60;
            padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 500;
            background: #0b1a14; color: #fff; white-space: nowrap;
            box-shadow: 0 6px 18px rgba(0,0,0,.28);
            opacity: 0; pointer-events: none; transition: opacity .15s ease .04s;
        }
        .admin-portal:not(.is-collapsed) .admin-nav a::after { content: none; }

        /* ---- 主区 ---- */
        .admin-portal .portal-main {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; overflow: visible;
        }
        .admin-portal .portal-topbar {
            position: sticky; top: var(--admin-navbar-h); z-index: 20;
            height: var(--portal-topbar-h); flex-shrink: 0;
            display: flex; align-items: center; justify-content: flex-start; gap: 12px;
            padding: 0 20px;
            background: var(--portal-card-bg);
            border-bottom: 1px solid var(--portal-card-border);
        }
        .admin-portal .portal-content {
            flex: 1; padding: 24px;
            background: var(--portal-content-bg); overflow: visible;
        }
        .admin-page-title { margin: 0 0 12px; font-size: 1rem; font-weight: 600; color: var(--portal-text); }
        .admin-page-title-gap { margin-top: 22px; }

        /* ---- 窄屏：侧栏收进抽屉（顶栏左上的开关改成开合抽屉）---- */
        .admin-overlay { display: none; }
        .admin-drawer-front { display: none; }
        @media (max-width: 1024px) {
            .admin-navbar .nav-menu { display: none; }
            .admin-navbar .brand-name { font-size: 1rem; }
            .admin-portal .admin-sidebar {
                position: fixed; top: var(--admin-navbar-h); bottom: 0; left: 0; height: auto;
                transform: translateX(-100%);
                transition: transform .25s ease, width .2s ease-linear;
                z-index: 950; box-shadow: 0 14px 48px rgba(0,0,0,.28);
            }
            .admin-portal .admin-sidebar.open { transform: translateX(0); }
            /* 抽屉态不参与折叠：宽度始终是展开宽度 */
            .admin-portal.is-collapsed { --admin-sidebar-w: var(--admin-sidebar-w-expanded); }
            .admin-drawer-front {
                display: block; margin-top: 4px;
                border-top: 1px solid var(--portal-sidebar-divider);
            }
            .admin-portal .portal-content { padding: 16px; }
            .admin-overlay.show {
                display: block; position: fixed; inset: var(--admin-navbar-h) 0 0 0;
                background: rgba(0,0,0,.45); z-index: 900;
            }
        }

        /* ---- 桌面端折叠态：只剩图标 ---- */
        @media (min-width: 1025px) {
            .admin-portal.is-collapsed .admin-group-label {
                position: absolute; opacity: 0; pointer-events: none;
            }
            .admin-portal.is-collapsed .admin-sidebar-toggle i { transform: rotate(180deg); }
            .admin-portal.is-collapsed .admin-nav a { justify-content: center; padding-left: 0; padding-right: 0; }
            .admin-portal.is-collapsed .admin-nav a > span {
                position: absolute; left: calc(100% + 10px);
                opacity: 0; pointer-events: none;
            }
            .admin-portal.is-collapsed .admin-nav a:hover::after { opacity: 1; }
        }

        /* ---- 深色主题：与前台共用 html[data-theme="dark"] ---- */
        html[data-theme="dark"] {
            --portal-sidebar-bg: #14261f; --portal-sidebar-divider: #2c3f36;
            --portal-sidebar-link-hover-bg: #24382f;
            --portal-accent: #8fc0a5; --portal-accent-hover: #6fb894;
            --portal-body-bg: #10201a; --portal-content-bg: #10201a;
            --portal-card-bg: #1b2c25; --portal-card-border: #33473d;
            --portal-card-shadow: none;
            --portal-text: #e4ebe6; --portal-text-muted: #93a49a;
            --portal-input-bg: #10201a; --portal-input-border: #4a5b52;
            --portal-table-border: #33473d; --portal-table-th-bg: #14261f;
        }
        html[data-theme="dark"] .admin-navbar {
            background: rgba(11,26,20,.9); border-bottom-color: rgba(255,255,255,.07);
        }
        html[data-theme="dark"] .admin-navbar.scrolled {
            background: rgba(11,26,20,.97); box-shadow: 0 1px 3px rgba(0,0,0,.4);
        }
        /* 内容审核：状态筛选页签（2026-10-08） */
        .review-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .rtab {
            padding: 6px 14px; border-radius: 999px; cursor: pointer;
            background: var(--portal-input-bg); color: var(--portal-text-muted);
            border: 1px solid var(--portal-input-border); font-size: 0.9rem;
        }
        .rtab.active { background: var(--portal-accent); color: #fff; border-color: var(--portal-accent); }
        .rtab-num { margin-left: 6px; opacity: 0.85; font-size: 0.85rem; }
        /* 自提自审标记：如实标注，不做任何背书（2026-10-08） */
        .badge-self { background: #6b5b2a; color: #ffe9a8; }
        /* 仪表盘（2026-10-08 重做） */
        /* ⚠️ styles.css 里的 .stat-card 是 flex 横排（含图标卡的布局），门户页这些
           无图标卡必须改回 block，否则「数字 + 标签」被挤在同一行、标签逐字竖排。
           政府端门户踩过同一个坑（#dash-content .stat-card{display:block}）。 */
        #dash-stats .stat-card, #dash-inventory .stat-card { display: block; }
        /* portal.css 的 .stat-grid 用的是 auto-fill（会保留空轨道 → 卡片挤在左侧不铺满）。
           只在管理端覆盖成 auto-fit，不动 portal.css，免得影响其余三个门户页。 */
        #dash-stats, #dash-inventory { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .stat-card[onclick] { cursor: pointer; }
        .dash-sub { margin-top: 4px; font-size: 0.8rem; color: var(--portal-text-muted); }
        .dash-note {
            margin-top: 20px; padding: 12px 14px; border-radius: 10px;
            background: var(--portal-table-th-bg); border: 1px solid var(--portal-card-border);
            font-size: 0.78rem; line-height: 1.75; color: var(--portal-text-muted);
        }
        /* 排序下拉：固定宽度不参与等分，否则状态页签被挤窄（2026-10-10） */
        #review-sort { flex: 0 0 116px; width: 116px; }
        /* 操作反馈 toast：替代原生 alert（内嵌浏览器会拦对话框，拦了连后面的
           列表刷新都不会执行，按钮就像「坏了」）（2026-10-10） */
        .admin-toast {
            position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(16px);
            background: var(--portal-accent); color: #fff; padding: 10px 18px;
            border-radius: 8px; font-size: 0.9rem; opacity: 0; pointer-events: none;
            transition: opacity .25s ease, transform .25s ease; z-index: 2000; max-width: 80vw;
            box-shadow: 0 8px 24px rgba(0,0,0,.18);
        }
        .admin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .admin-toast.error { background: #b3382f; }
        /* 驳回理由输入框：沿用门户输入框配色 */
        #reject-reason {
            width: 100%; border: 1px solid var(--portal-input-border); border-radius: 8px;
            padding: 10px; font-size: 0.9rem; resize: vertical;
            background: var(--portal-input-bg); color: var(--portal-text);
        }
        /* 表格套一张卡片：用户管理 / 讨论帖管理 */
        .admin-table-card { padding: 0; overflow: hidden; }
        .admin-table-card table th, .admin-table-card table td { padding: 12px 16px; }
        .admin-table-card tbody tr:last-child td { border-bottom: none; }
        .admin-table-card tbody tr:hover { background: var(--portal-table-th-bg); }
    </style>
</head>
<body>
<div class="portal admin-portal" id="admin-portal">
    <!-- 顶部：复用前台菜单栏（左侧开关 + 网站徽标，中间导航居中） -->
    <nav class="navbar admin-navbar" id="navbar">
        <div class="nav-container">
            <div class="admin-nav-left">
                <button class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="收起侧栏" aria-expanded="true" title="收起侧栏"><i class="fas fa-angles-left"></i></button>
                <a class="nav-brand" href="index.html">
                    <div class="brand-logo"><i class="fas fa-seedling"></i></div>
                    <span class="brand-name">粤乡智匠</span>
                </a>
            </div>
            <div class="nav-menu" id="nav-menu" aria-label="主导航">
                <a class="nav-item active" href="admin.html" aria-current="page">系统管理后台</a>
                <a class="nav-item" href="agriculture.html">农业技能</a>
                <a class="nav-item" href="ecommerce.html">电商运营</a>
                <a class="nav-item" href="crafts.html">手工传承</a>
                <a class="nav-item" href="resources.html">本土资源</a>
                <a class="nav-item" href="employment.html">就业对接</a>
            </div>
            <div class="nav-actions">
                <!-- 与前台 .nav-actions 保持同序同款：消息中心 → 大字模式 → 主题 → 账号。
                     缺一个就少一个能力（前台登录用户全都有），顺序不同会显得后台是另一套东西。 -->
                <div class="teacher-quick-menu" id="admin-quick-menu">
                    <div class="msg-center-wrap">
                        <button class="icon-btn" id="quick-message-btn" title="消息通知">
                            <i class="fas fa-bell"></i>
                            <span class="badge is-hidden" id="message-badge">0</span>
                        </button>
                        <div class="msg-dropdown" id="msg-dropdown">
                            <div class="msg-dropdown-header">
                                <h4>消息中心</h4>
                                <div class="msg-dropdown-actions">
                                    <button id="msg-unread-jump" class="msg-unread-jump is-hidden" title="查看未读通知">
                                        <span id="msg-unread-jump-count">0</span>
                                    </button>
                                    <button id="msg-mark-all-read" title="全部已读"><i class="fas fa-check-double"></i></button>
                                    <button id="msg-clear-read" title="清除已读"><i class="fas fa-trash-can"></i></button>
                                </div>
                            </div>
                            <div class="msg-dropdown-tabs">
                                <button class="msg-tab-btn active" data-tab="unread"><i class="fas fa-bell"></i> 未读</button>
                                <button class="msg-tab-btn" data-tab="read"><i class="fas fa-envelope-open"></i> 已读</button>
                                <button class="msg-tab-btn" data-tab="messages"><i class="fas fa-envelope"></i> 我的对话</button>
                            </div>
                            <div class="msg-dropdown-body" id="msg-notifications-list">
                                <div class="msg-empty">暂无通知</div>
                            </div>
                            <div class="msg-dropdown-body is-hidden" id="msg-messages-list">
                                <div class="msg-empty">暂无私信</div>
                            </div>
                            <div class="msg-dropdown-footer">
                                <button id="msg-compose-btn"><i class="fas fa-pen"></i> 写消息</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="icon-btn large-text-toggle" id="large-text-toggle" aria-label="切换大字模式" aria-pressed="false" title="大字模式">
                    <i class="fas fa-text-height"></i>
                </button>
                <button class="icon-btn" id="admin-theme-toggle" aria-label="切换主题" title="切换主题"><i class="fas fa-moon"></i></button>
                <div class="connection-dot" id="connection-status">
                    <span class="dot"></span>
                </div>
                <div class="user-info" id="admin-user-info">
                    <div class="user-avatar-wrap" id="admin-user-trigger">
                        <div class="avatar-circle"><i class="fas fa-user-shield"></i></div>
                        <div class="user-meta">
                            <span class="user-name" id="admin-user-name">系统管理员</span>
                            <span class="user-role" id="admin-user-role">系统管理员</span>
                        </div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="dropdown-menu is-hidden" id="admin-user-menu">
                        <div class="dropdown-header">
                            <span class="dropdown-name" id="admin-dropdown-name">系统管理员</span>
                            <span class="dropdown-email" id="admin-dropdown-id">admin_demo</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout" id="admin-logout-btn"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="admin-overlay" id="sidebar-overlay"></div>

    <div class="admin-shell">
        <aside class="portal-sidebar admin-sidebar" id="portal-sidebar">
            <!-- 窄屏抽屉里补一份前台导航（宽屏由顶部菜单栏承担） -->
            <div class="admin-drawer-front">
                <div class="admin-group-label">前台导航</div>
                <a href="agriculture.html"><i class="fas fa-seedling"></i><span>农业技能</span></a>
                <a href="ecommerce.html"><i class="fas fa-cart-shopping"></i><span>电商运营</span></a>
                <a href="crafts.html"><i class="fas fa-paint-brush"></i><span>手工传承</span></a>
                <a href="resources.html"><i class="fas fa-book-open"></i><span>本土资源</span></a>
                <a href="employment.html"><i class="fas fa-briefcase"></i><span>就业对接</span></a>
            </div>
            <!-- 侧栏按能力显隐（data-capability）：portal.js 的 PORTAL.applyCapabilities 读后端
                 下发的能力清单后隐藏不持有的项。不按角色名写死 —— 运营角色（operator）持内容管理权、
                 不持用户管理与审核权，它看到的是这张表的一个子集，而「子集是哪几项」只在
                 backend/core/permissions.py 一处定义。仪表盘对所有能进本页的角色开放，故不标。 -->
            <nav class="admin-nav" aria-label="后台导航">
                <div class="admin-group-label">系统管理</div>
                <a href="#" class="active" data-page="dashboard" data-tip="仪表盘"><i class="fas fa-tachometer-alt"></i><span>仪表盘</span></a>
                <a href="#" data-page="users" data-tip="用户管理" data-capability="user.manage"><i class="fas fa-users"></i><span>用户管理</span></a>
                <a href="#" data-page="reviews" data-tip="内容审核" data-capability="review.moderate"><i class="fas fa-check-circle"></i><span>内容审核</span></a>
                <a href="#" data-page="announcements" data-tip="系统公告" data-capability="announcement.manage"><i class="fas fa-bullhorn"></i><span>系统公告</span></a>
                <a href="#" data-page="content" data-tip="内容监管" data-capability="community.manage"><i class="fas fa-shield"></i><span>内容监管</span></a>
            </nav>
        </aside>
        <div class="portal-main">
            <div class="portal-topbar">
                <h2 id="page-title">仪表盘</h2>
            </div>
        <div class="portal-content">
            <div class="page active" id="page-dashboard">
                <h3 class="admin-page-title">待处理</h3>
                <div class="stat-grid" id="dash-stats"><div class="loading-spinner"><i class="fas fa-spinner spin"></i></div></div>
                <h3 class="admin-page-title admin-page-title-gap">账号与内容存量</h3>
                <div class="stat-grid" id="dash-inventory"><div class="loading-spinner"><i class="fas fa-spinner spin"></i></div></div>
                <p class="dash-note" id="dash-note"></p>

function setupLargeTextToggle() {

    applyLargeText(saved);
    btn.addEventListener('click', function () {
        var next = document.documentElement.dataset.largeText !== '1';
        applyLargeText(next);
        try { localStorage.setItem('yuexiang_large_text', next ? '1' : '0'); } catch (e) { /* 隐私模式忽略 */ }

}
function applyLargeText(on) {
    var root = document.documentElement;

// ---- 主题开关：与前台共用 yuexiang_theme，同一套门户变量随之切换 ----
(function () {

// ---- 侧栏开关（顶栏左上角）：宽屏折叠成图标栏（new-api 的 icon 模式，改一个 CSS
//      变量、宽度 200ms 过渡），窄屏开合抽屉；两种形态共用一个按钮 ----
(function () {
    var shell = document.getElementById('admin-portal');
    var sidebar = document.getElementById('portal-sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    var btn = document.getElementById('admin-sidebar-toggle');
    if (!shell || !sidebar || !btn) return;
    var icon = btn.querySelector('i');
    var KEY = 'yuexiang_admin_sidebar_collapsed';
    var mq = window.matchMedia('(max-width: 1024px)');

    function syncBtn() {
        var label;
        if (mq.matches) {
            var open = sidebar.classList.contains('open');
            if (icon) icon.className = 'fas ' + (open ? 'fa-times' : 'fa-bars');
            label = open ? '关闭菜单' : '打开菜单';
            btn.setAttribute('aria-expanded', String(open));
        } else {
            var collapsed = shell.classList.contains('is-collapsed');
            if (icon) icon.className = 'fas fa-angles-left';
            label = collapsed ? '展开侧栏' : '收起侧栏';
            btn.setAttribute('aria-expanded', String(!collapsed));
        }
        btn.title = label;
        btn.setAttribute('aria-label', label);
    }

    function applyCollapsed(collapsed) {
        shell.classList.toggle('is-collapsed', !!collapsed);
        syncBtn();
    }

    function setDrawer(open) {
        sidebar.classList.toggle('open', open);
        if (overlay) overlay.classList.toggle('show', open);
        syncBtn();
    }

    var saved = false;
    try { saved = localStorage.getItem(KEY) === '1'; } catch (e) { /* 隐私模式忽略 */ }
    applyCollapsed(saved);

    btn.addEventListener('click', function () {
        if (mq.matches) {
            setDrawer(!sidebar.classList.contains('open'));
            return;
        }
        var next = !shell.classList.contains('is-collapsed');
        applyCollapsed(next);
        try { localStorage.setItem(KEY, next ? '1' : '0'); } catch (e) { /* 隐私模式忽略 */ }
    });
    if (overlay) overlay.addEventListener('click', function () { setDrawer(false); });
    // 跨断点后按钮含义会变：收起抽屉，并按新形态刷新图标与文案
    mq.addEventListener('change', function () { setDrawer(false); syncBtn(); });
    // Ctrl/Cmd + B，与 new-api 的快捷键一致
    document.addEventListener('keydown', function (e) {
        if (!(e.metaKey || e.ctrlKey) || (e.key !== 'b' && e.key !== 'B')) return;
        if (e.target && e.target.matches && e.target.matches('input, textarea, select')) return;
        e.preventDefault();
        btn.click();
    });
    syncBtn();
})();

// 只有「后端确实给了数字」才渲染该卡。后端查不到会给 null ——
// 前端**绝不补 0**：补 0 会把「查不到」伪装成「确实是 0」，那是编数。
function isNum(v) { return typeof v === 'number' && isFinite(v); }

function sumIfNum(arr) {
    var ok = true, s = 0;
    arr.forEach(function(v) { if (isNum(v)) { s += v; } else { ok = false; } });
    return ok ? s : null;
}

function statCard(num, label, sub, onclickPage) {
    return '<div class="stat-card"' + (onclickPage ? ' onclick="goPage(\'' + onclickPage + '\')"' : '') + '>' +
        '<div class="num">' + num + '</div>' +
        '<div class="label">' + esc(label) + '</div>' +
        (sub ? '<div class="dash-sub">' + esc(sub) + '</div>' : '') +
        '</div>';
}

// 点仪表盘卡片跳到对应页面（复用侧栏链接，走既有 onPageChange 逻辑）

function loadDashboard() {
    adminCall('/api/admin/dashboard', 'GET').then(function(r) {
        var ov = (r && r.overview) || {};
        var us = ov.users || {}, rv = ov.reviews || {}, ct = ov.content || {};

        // —— 第一层：待处理（都是行动项，点了直接跳对应页面）——
        var todo = [];
        if (isNum(rv.pending)) {
            var sub = null;
            if (rv.oldest_pending_days === 0) { sub = '最久已等待不到 1 天'; }
            else if (isNum(rv.oldest_pending_days)) { sub = '最久已等待 ' + rv.oldest_pending_days + ' 天'; }
            todo.push(statCard(rv.pending, '待审核内容', sub, 'reviews'));
        }
        if (isNum(us.suspended)) {
            todo.push(statCard(us.suspended, '停用账号',
                isNum(us.total) ? ('共 ' + us.total + ' 个账号') : null, 'users'));
        }
        document.getElementById('dash-stats').innerHTML =
            todo.length ? todo.join('')
                : '<div class="empty-state"><i class="fas fa-check-circle"></i><p>暂无待处理事项</p></div>';

        // —— 第二层：账号与内容存量 ——
        var inv = [];
        if (isNum(us.student)) { inv.push(statCard(us.student, '学员')); }
        var orgSum = sumIfNum([us.teacher, us.enterprise, us.government]);
        if (orgSum !== null) { inv.push(statCard(orgSum, '教师 / 企业 / 政府')); }
        var ctSum = sumIfNum([ct.jobs, ct.models, ct.cases, ct.policies]);
        if (ctSum !== null) { inv.push(statCard(ctSum, '岗位 / 模型 / 案例 / 政策')); }
        document.getElementById('dash-inventory').innerHTML =
            inv.length ? inv.join('')
                : '<div class="empty-state"><i class="fas fa-database"></i><p>暂无可统计内容</p></div>';

        document.getElementById('dash-note').textContent =
            '口径说明：仅统计库内真实可算的项；成功案例正文不落库，条数取自数据模块。' +
            '在线人数、日活、增长趋势、平均审核时长等指标因缺少数据源，不予展示。';
    }).catch(function() {
        // ⚠️ 原先没有 .catch —— 接口一失败就是一条未捕获异常，统计区永远空白且无任何提示
        document.getElementById('dash-stats').innerHTML =
            '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>统计加载失败</p></div>';
        document.getElementById('dash-inventory').innerHTML = '';
        document.getElementById('dash-note').textContent = '';
    });
}

// admin.html 专用的请求封装（2026-10-08）。
// core.js 的 apiCall 在非 2xx 时只抛出 `HTTP xxx`，**把响应体的 message 丢了**；
// 而删除/停用这类操作恰恰要把「为什么不行」原样告诉管理员（自删 / 末位超管 /
// 关联数据清单），所以这里自己发一次 fetch 并把 body 挂在 err.data 上。
async function adminCall(endpoint, method, body) {
    var headers = { 'Content-Type': 'application/json' };
    if (AppState.sessionId) { headers['X-Session-Id'] = AppState.sessionId; }
    var resp = await fetch(endpoint, {
        method: method || 'GET', headers: headers,
        body: body ? JSON.stringify(body) : undefined
    });
    var data = null;
    try { data = await resp.json(); } catch (e) { data = null; }
    if (!resp.ok) {
        var err = new Error((data && data.message) || ('HTTP ' + resp.status));
        err.status = resp.status;
        err.data = data;
        throw err;
    }
    return data || {};
}

function loadUsers() {
    var q = document.getElementById('user-search').value;
    var role = document.getElementById('user-role-filter').value;
    apiCall('/api/admin/users?search=' + encodeURIComponent(q) + '&role=' + role, 'GET').then(function(r) {
        var list = document.getElementById('user-list');
        if (!r.users || !r.users.length) { list.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><p>暂无用户</p></div>'; return; }
        list.innerHTML = '<div class="card admin-table-card"><table><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>关联数据</th><th>操作</th></tr></thead><tbody>' +
            r.users.map(function(u) {
                // 「能不能删/能不能停用」由后端判定（can_delete / can_suspend），
                // 前端只负责渲染，不自己下结论 —— 否则「藏了按钮、接口照样能删」等于没拦。
                // ⚠️ 字段缺失（常驻服务没重启、新前端配旧后端）时一律不画按钮，也不输出结论性文案。
                var acts = '<button class="btn btn-primary btn-sm" onclick="editUser(\'' + esc(u.username) + '\',\'' + esc(u.role) + '\',\'' + esc(u.status) + '\')">编辑</button> ';
                if (u.can_suspend === true) {
                    acts += (u.status === 'suspended')
                        ? '<button class="btn btn-success btn-sm" onclick="setUserStatus(\'' + esc(u.username) + '\',\'active\')">启用</button> '
                        : '<button class="btn btn-outline btn-sm" onclick="setUserStatus(\'' + esc(u.username) + '\',\'suspended\')">停用</button> ';
                }
                if (u.can_delete === true) {
                    acts += '<button class="btn btn-danger btn-sm" onclick="delUser(\'' + esc(u.username) + '\')">删除</button>';
                } else if (u.block_reason) {
                    acts += '<span class="badge" title="' + esc(u.block_reason) + '">不可删除</span>';
                }
                var relCell = '';
                if (typeof u.relation_count === 'number') {
                    var detail = (u.relations || []).map(function(x) { return x.label + ' ' + x.count + ' 条'; }).join('、');
                    relCell = (u.relation_count === 0)
                        ? '<span style="color:var(--portal-text-muted)">无</span>'
                        : '<span title="' + esc(detail) + '">' + u.relation_count + ' 条</span>';
                }
                return '<tr><td>' + esc(u.username) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.role) + '</td>' +
                    '<td><span class="badge ' + (u.status === 'active' ? 'badge-green' : 'badge-red') + '">' + esc(u.status) + '</span></td>' +
                    '<td>' + relCell + '</td>' +
                    '<td>' + acts + '</td></tr>';
            }).join('') + '</tbody></table></div>';
    }).catch(function() { document.getElementById('user-list').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>加载失败</p></div>'; });
}

function editUser(id, role, status) {
    var nr = prompt('角色 (student/teacher/enterprise/government/super_admin):', role); if (!nr) return;
    var ns = prompt('状态 (active/suspended):', status); if (!ns) return;
    apiCall('/api/admin/users/' + encodeURIComponent(id), 'PUT', { role: nr, status: ns }).then(function(r) { alert(r.message); if (r.success) loadUsers(); });
}

// 停用 = 删除的替代方案：本人无法登录，但历史数据完整保留、随时可恢复。
function setUserStatus(id, st) {
    var msg = (st === 'suspended')
        ? '确定停用「' + id + '」？\n停用后本人无法登录，所有数据完整保留，可随时启用恢复。'
        : '确定启用「' + id + '」？';
    if (!confirm(msg)) return;
    adminCall('/api/admin/users/' + encodeURIComponent(id) + '/status', 'POST', { status: st })
        .then(function(r) { alert(r.message); loadUsers(); })
        .catch(function(e) { alert((e && e.message) || '操作失败，请重试'); loadUsers(); });
}

function delUser(id) {
    if (!confirm('确定删除账号「' + id + '」？\n此操作不可恢复。')) return;
    adminCall('/api/admin/users/' + encodeURIComponent(id), 'DELETE')
        .then(function(r) { alert(r.message); loadUsers(); })
        .catch(function(e) {
            // 后端会说明拦在哪一关；409 还会带回关联数据清单
            var d = e && e.data;
            var extra = (d && d.relations && d.relations.length)
                ? '\n\n关联数据：\n' + d.relations.map(function(x) { return '· ' + x.label + ' ' + x.count + ' 条'; }).join('\n')
                : '';
            alert(((d && d.message) || (e && e.message) || '删除失败') + extra);
            loadUsers();
        });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// 当前审核状态页签：pending / approved / rejected
var reviewStatus = 'pending';

function setReviewStatus(st) {
    reviewStatus = st;
    [].forEach.call(document.querySelectorAll('#review-status-tabs .rtab'), function(b) {
        b.classList.toggle('active', b.getAttribute('data-status') === st);
    });
    loadReviews();
}

function renderReviewCounts(counts) {
    // 后端没下发 counts（旧后端/接口降级）时不动，绝不自己补 0 —— 补 0 等于编数。
    if (!counts) return;
    ['pending', 'approved', 'rejected'].forEach(function(k) {
        var el = document.getElementById('rtab-n-' + k);
        if (el && typeof counts[k] === 'number') { el.textContent = '(' + counts[k] + ')'; }
    });
}

function loadReviews() {
    var t = document.getElementById('review-filter').value;
    var s = document.getElementById('review-sort').value;
    apiCall('/api/admin/reviews?content_type=' + t + '&status=' + reviewStatus + '&sort=' + s, 'GET').then(function(r) {
        var list = document.getElementById('review-list');
        renderReviewCounts(r.counts);
        if (!r.reviews || !r.reviews.length) {
            var emptyText = { pending: '暂无待审核', approved: '暂无已通过记录', rejected: '暂无已驳回记录' }[reviewStatus] || '暂无记录';
            list.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i><p>' + emptyText + '</p></div>';
            return;
        }
        list.innerHTML = r.reviews.map(function(rv) {
            var typeName = { course: '课程', job: '职位', model_3d: '3D模型', success_case: '成功案例' }[rv.content_type] || rv.content_type;
            var detailHtml = '';
            var previewBtn = '';
            if (rv.content_type === 'success_case' && rv.detail) {
                var sc = rv.detail;
                var srcN = (sc.sources || []).length;
                detailHtml = '<div style="margin-top:8px;font-size:0.9rem;color:var(--portal-text)">' +
                    '<div><strong>标题：</strong>' + (sc.title || '-') + '</div>' +
                    '<div><strong>地区：</strong>' + (sc.region || sc.location || '-') + '</div>' +
                    '<div><strong>概述：</strong>' + (sc.description || '-') + '</div>' +
                    '<div><strong>资料来源：</strong>' + srcN + ' 条</div></div>';
            } else if (rv.content_type === 'model_3d' && rv.detail) {
                var d = rv.detail;
                var craftNames = { embroidery: '广绣', woodcarving: '潮汕木雕', ceramics: '石湾陶艺', lacquer: '阳江漆器' };
                detailHtml = '<div style="margin-top:8px;font-size:0.9rem;color:var(--portal-text)">' +
                    '<div><strong>标题：</strong>' + (d.title || '-') + '</div>' +
                    '<div><strong>类型：</strong>' + (craftNames[d.craft_type] || d.craft_type || '-') + '</div>' +
                    '<div><strong>描述：</strong>' + (d.description || '-') + '</div>' +
                    '<div><strong>文件：</strong>' + (d.file_name || '-') + '</div></div>';
                previewBtn = '<button class="btn btn-outline btn-sm" onclick="previewReviewModel(\'' + encodeURIComponent(d.file_path || '') + '\', \'' + (d.title || '').replace(/'/g, '') + '\')"><i class="fas fa-cube"></i> 预览</button>';
            } else if (rv.content_type === 'job' && rv.detail) {
                // 职位必须能看清内容再审批。此前只有通用兜底分支（仅显示标题），
                // 管理员等于"盲审"——看不到公司/薪资/地点/要求/描述（2026-10-06 修复）。
                var jb = rv.detail;
                // requirements 可能是数组，也可能是字符串（如「无」）——字符串没有 join，
                // 直接调会让整张列表渲染失败（2026-10-12 修）。
                var reqRaw = jb.requirements;
                var reqs = Array.isArray(reqRaw) ? reqRaw.join('、') : (reqRaw || '');
                detailHtml = '<div style="margin-top:8px;font-size:0.9rem;color:var(--portal-text)">' +
                    '<div><strong>职位：</strong>' + esc(jb.title) + '</div>' +
                    '<div><strong>公司：</strong>' + esc(jb.company) + '</div>' +
                    '<div><strong>薪资：</strong>' + esc(jb.salary) + '</div>' +
                    '<div><strong>地点：</strong>' + esc(jb.location) + '</div>' +
                    '<div><strong>类别：</strong>' + esc(jb.category) + '</div>' +
                    '<div><strong>要求：</strong>' + esc(reqs) + '</div>' +
                    '<div><strong>描述：</strong>' + esc(jb.description) + '</div></div>';
            } else if (rv.detail) {
                var nm = rv.detail.title || rv.detail.name || rv.detail.position || '';
                detailHtml = '<div style="margin-top:8px;font-size:0.9rem;color:var(--portal-text)"><strong>内容：</strong>' + nm + '</div>';
            }
            var statusBadge = { pending: 'badge-yellow', approved: 'badge-green', rejected: 'badge-red' }[rv.status] || 'badge-yellow';
            var statusText = { pending: '待审核', approved: '已通过', rejected: '已驳回' }[rv.status] || rv.status;
            // 「自提自审」如实标注：提交者与审核人是同一个账号时，这条记录
            // 不含任何第三方把关。平台预置内容（如 success_case）就是这种情况，
            // 数据本身是真实的，只是不能拿它当「已审核」的背书（2026-10-08）。
            var selfTag = rv.is_self_reviewed
                ? ' <span class="badge badge-self" title="提交者与审核人为同一账号，该记录不含第三方把关">自审</span>'
                : '';
            // 时间戳带标签展示，且与排序口径一致：修改时间取最近一次审核动作的时间，
            // 没审过（含撤销后 reviewed_at 被清空）退回发布时间（2026-10-10）。
            var modifiedAt = rv.reviewed_at || rv.created_at;
            var metaLine = '<div style="margin-top:4px;font-size:0.85rem;color:var(--portal-text-muted)">提交者: ' + esc(rv.submitter_id) + ' | 发布时间: ' + esc(rv.created_at) + ' | 修改时间: ' + esc(modifiedAt) +
                (rv.reviewed_by ? ' | 审核人: ' + esc(rv.reviewed_by) : '') +
                (rv.review_comment ? ' | 理由: ' + esc(rv.review_comment) : '') + '</div>';
            var actionBtns = (rv.status === 'pending')
                ? '<button class="btn btn-success" onclick="approveReview(' + rv.id + ')">通过</button><button class="btn btn-danger" onclick="rejectReview(' + rv.id + ')">驳回</button>'
                : '<button class="btn btn-outline" onclick="revokeReview(' + rv.id + ')">撤销审核</button>';
            return '<div class="card"><div><strong>' + esc(typeName) + '</strong> <span class="badge ' + statusBadge + '">' + esc(statusText) + '</span>' + selfTag + '</div>' + metaLine + detailHtml + '<div style="margin-top:8px;display:flex;gap:8px">' + previewBtn + actionBtns + '</div></div>';
        }).join('');
    }).catch(function() {
        document.getElementById('review-list').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>加载失败</p></div>';
    });
}
document.getElementById('review-filter').addEventListener('change', loadReviews);
document.getElementById('review-sort').addEventListener('change', loadReviews);
[].forEach.call(document.querySelectorAll('#review-status-tabs .rtab'), function(b) {
    b.addEventListener('click', function() { setReviewStatus(b.getAttribute('data-status')); });
});

// ---- 操作反馈与确认：全部走页面内组件，不用原生 alert/confirm/prompt ----
// 内嵌浏览器会拦这些对话框：被拦后接口调用都不会发出，按钮就像坏了。
function showAdminToast(msg, isError) {
    var t = document.getElementById('admin-toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function() { t.classList.remove('show'); }, 2600);
}
var adminConfirmAction = null;
function adminConfirm(msg, onOk) {
    document.getElementById('admin-confirm-msg').textContent = msg;
    adminConfirmAction = onOk;
    document.getElementById('admin-confirm-modal').classList.remove('is-hidden');
}
function closeAdminConfirm() {
    document.getElementById('admin-confirm-modal').classList.add('is-hidden');
    adminConfirmAction = null;
}
document.getElementById('admin-confirm-ok').addEventListener('click', function() {
    var fn = adminConfirmAction;
    closeAdminConfirm();
    if (fn) fn();
});

// ---- 驳回理由弹窗 ----
var rejectTargetId = null;
function rejectReview(id) {
    rejectTargetId = id;
    document.getElementById('reject-reason').value = '';
    document.getElementById('reject-modal').classList.remove('is-hidden');
}
function closeRejectModal() {
    document.getElementById('reject-modal').classList.add('is-hidden');
    rejectTargetId = null;
}
function confirmReject() {
    if (rejectTargetId === null) return;
    var id = rejectTargetId;
    var c = document.getElementById('reject-reason').value.trim();
    adminCall('/api/admin/reviews/' + id + '/reject', 'POST', { comment: c || '' })
        .then(function(r) { closeRejectModal(); showAdminToast(r.message); loadReviews(); })
        .catch(function(e) { showAdminToast((e && e.message) || '操作失败，请重试', true); });
}

function approveReview(id) {
    adminCall('/api/admin/reviews/' + id + '/approve', 'POST')
        .then(function(r) { showAdminToast(r.message); loadReviews(); })
        .catch(function(e) { showAdminToast((e && e.message) || '操作失败，请重试', true); });
}
// 撤销审核：已通过 / 已驳回退回待审核，可重新处理
function revokeReview(id) {
    adminConfirm('确定撤销这条审核？撤销后该内容退回「待审核」，需重新处理。', function() {
        adminCall('/api/admin/reviews/' + id + '/revoke', 'POST')
            .then(function(r) { showAdminToast(r.message); loadReviews(); })
            .catch(function(e) { showAdminToast((e && e.message) || '操作失败，请重试', true); });
    });
}

function previewReviewModel(filePath, title) {
    var modal = document.getElementById('review-model-modal');
    var viewer = document.getElementById('review-model-viewer');
    if (!modal || !viewer) return;
    document.getElementById('review-model-title').textContent = title || '模型预览';
    viewer.src = decodeURIComponent(filePath || '');
    viewer.alt = title || '';
    modal.classList.remove('is-hidden');
}
function closeReviewModel() {
    var modal = document.getElementById('review-model-modal');
    var viewer = document.getElementById('review-model-viewer');
    if (modal) modal.classList.add('is-hidden');
    if (viewer) viewer.removeAttribute('src');
}

function loadAnnouncements() {
    apiCall('/api/admin/system-announcements', 'GET').then(function(r) {
        var list = document.getElementById('ann-list');
        if (!r.announcements || !r.announcements.length) { list.innerHTML = '<div class="empty-state"><i class="fas fa-bullhorn"></i><p>暂无公告</p></div>'; return; }
        list.innerHTML = r.announcements.map(function(a) {
            return '<div class="card"><h4>' + (a.is_pinned ? '📌 ' : '') + a.title + '</h4><p style="font-size:0.85rem;color:var(--portal-text-muted);margin-top:4px">' + a.content.slice(0, 200) + '</p><div style="margin-top:8px"><button class="btn btn-danger btn-sm" onclick="delAnn(' + a.id + ')">删除</button></div></div>';
        }).join('');
    });
}
function publishAnn() { var t = document.getElementById('ann-title').value.trim(); var c = document.getElementById('ann-content').value.trim(); if (!t || !c) { alert('标题和内容不能为空'); return; } apiCall('/api/admin/system-announcements', 'POST', { title: t, content: c }).then(function(r) { alert(r.message); if (r.success) { document.getElementById('ann-title').value = ''; document.getElementById('ann-content').value = ''; loadAnnouncements(); } }); }
function delAnn(id) { if (!confirm('确定删除?')) return; apiCall('/api/admin/system-announcements/' + id, 'DELETE').then(function(r) { if (r.success) loadAnnouncements(); }); }

function loadContent() {
    apiCall('/api/discussions', 'GET').then(function(r) {
        var list = document.getElementById('disc-list');
        if (!r.discussions || !r.discussions.length) { list.innerHTML = '<div class="empty-state"><i class="fas fa-shield"></i><p>暂无帖子</p></div>'; return; }
        list.innerHTML = '<div class="card admin-table-card"><table><thead><tr><th>标题</th><th>作者</th><th>时间</th><th>操作</th></tr></thead><tbody>' +
            r.discussions.map(function(d) { return '<tr><td>' + d.title + '</td><td>' + (d.user_name || '') + '</td><td>' + (d.created_at || '').slice(0, 16) + '</td><td><button class="btn btn-danger btn-sm" onclick="delDisc(' + d.id + ')">删除</button></td></tr>'; }).join('') + '</tbody></table></div>';
    });
}
function delDisc(id) { if (!confirm('确定删除?')) return; apiCall('/api/admin/discussions/' + id, 'DELETE').then(function(r) { alert(r.message); if (r.success) loadContent(); }); }
</script>
</body>
</html>
