<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例详情 - 粤乡智匠</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* case-detail 页面专属样式 — 通用变量和reset由styles.css提供 */

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .page-header {
            background: var(--gradient-hero);
            color: #fff;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }
        .header-brand i {
            font-size: 1.3rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-xs);
            color: #fff;
            font-size: 0.9rem;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
        }
        .back-btn:hover { background: rgba(255,255,255,0.22); }

        /* ---- Main ---- */
        .main-wrap {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        /* ---- Hero Banner ---- */
        .case-hero {
            background: var(--gradient-main);
            border-radius: var(--radius);
            padding: 48px 40px;
            color: #fff;
            position: relative;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .case-hero::after {
            content: '';
            position: absolute;
            top: -40%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .case-hero .location-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.18);
            padding: 5px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .case-hero h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .case-hero .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 520px;
            line-height: 1.6;
        }

        /* ---- Stats Grid ---- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 24px 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: #fff;
            font-size: 1.1rem;
        }
        .stat-card .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .stat-card .stat-label {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* ---- Content Section ---- */
        .content-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 28px;
        }
        .content-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .content-card h2 i {
            color: var(--accent-blue);
        }
        .content-card p, .content-card li {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .content-card ul {
            list-style: none;
            padding: 0;
        }
        .content-card ul li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .content-card ul li:last-child { border-bottom: none; }
        .content-card ul li::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            flex-shrink: 0;
        }

        /* ---- Timeline ---- */
        .timeline {
            position: relative;
            padding-left: 28px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--border);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: 2px solid var(--bg-secondary);
            box-shadow: 0 0 0 2px var(--accent-blue);
        }
        .timeline-item .t-period {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-blue);
            background: rgba(0, 180, 216, 0.12);
            border-radius: 9999px;
            padding: 2px 10px;
            margin-bottom: 6px;
        }
        .timeline-item .t-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .timeline-item .t-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ---- 小字说明（口径标注） ---- */
        .section-note {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: -6px 0 14px;
            line-height: 1.6;
        }

        /* ---- 案例背景正文分段 ---- */
        .prose p + p { margin-top: 12px; }

        /* ---- 资料来源 ---- */
        .case-sources ul li {
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 12px 0;
        }
        .case-sources ul li::before { display: none; }
        .case-sources a {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            word-break: break-word;
            line-height: 1.5;
        }
        .case-sources a:hover { text-decoration: underline; }
        .case-sources .src-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* ---- Quote ---- */
        .quote-block {
            background: linear-gradient(135deg, rgba(0,180,216,0.06), rgba(16,185,129,0.06));
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
            padding: 20px 24px;
            margin-bottom: 28px;
        }
        .quote-block p {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .quote-block .quote-author {
            margin-top: 10px;
            font-size: 0.85rem;
            font-style: normal;
            font-weight: 600;
            color: var(--accent-blue);
        }

        /* ---- Loading / Error ---- */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
        }
        .spinner-lg {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state p { color: var(--text-muted); font-size: 0.95rem; }

        .error-state {
            text-align: center;
            padding: 80px 20px;
        }
        .error-state i {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .error-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .error-state p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-primary {
            background: var(--gradient-main);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* ---- Footer ---- */
        .page-footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-light);
        }

        @media (max-width: 640px) {
            .case-hero { padding: 32px 24px; }
            .case-hero h1 { font-size: 1.4rem; }
            .content-card { padding: 24px 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="header-inner">
            <a href="index.html" class="header-brand">
                <i class="fas fa-seedling"></i> 粤乡智匠
            </a>
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回首页
            </a>
        </div>
    </header>

    <main class="main-wrap" id="main-content">
        <div class="loading-state" id="loading">
            <div class="spinner-lg"></div>
            <p>正在加载案例详情...</p>
        </div>
    </main>

    <footer class="page-footer">
        <p>粤乡智匠 - 基于AI实训系统的农村本土人才赋能平台</p>
    </footer>

    <script>
    (async function() {
        const main = document.getElementById('main-content');
        const params = new URLSearchParams(window.location.search);
        const caseId = parseInt(params.get('id'));

        if (!caseId) {
            showError('未指定案例', '请从首页选择一个案例查看详情。');
            return;
        }

        document.title = `案例 #${caseId} - 粤乡智匠`;

        try {
            const res = await fetch('/api/resources/cases');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            if (!data.success || !data.cases) {
                showError('案例未找到', '案例数据加载失败。');
                return;
            }

            const c = data.cases.find(item => item.id === caseId);
            if (!c) {
                // 接口只下发审核通过的案例 —— 未通过/已驳回的会走到这里，不能说成"链接错了"
                const pending = (data.case_review && data.case_review.pending) || 0;
                showError('案例未找到',
                    `未找到 ID 为 ${caseId} 的案例：它可能尚未通过超级管理员审核（当前待审 ${pending} 条），或链接已失效。`);
                return;
            }

            renderCase(c, data);
        } catch (e) {
            console.error('加载案例失败:', e);
            showError('加载失败', `无法连接服务器（${e.message}），请确保服务已启动。`);
        }

        // 把纯文本按空行拆成多个 <p>，避免长段落挤成一坨
        function toParagraphs(text) {
            return String(text || '')
                .split(/\n{2,}/)
                .filter(s => s.trim())
                .map(s => `<p>${s.trim()}</p>`)
                .join('');
        }

        function renderCase(c, envelope) {
            const stats = Array.isArray(c.stats) ? c.stats : [];
            const milestones = Array.isArray(c.milestones) ? c.milestones : [];
            const lessons = Array.isArray(c.lessons) ? c.lessons : [];
            const sources = Array.isArray(c.sources) ? c.sources : [];
            const hasQuote = !!(c.quote && c.quote_author);

            // 口径说明由服务端下发（事实源在 cases_data.py），此处仅兜底
            const sourceNote = (envelope && envelope.source_note)
                || '本页内容依据公开报道整理，数据与事实均来自下列公开来源，仅供参考。';
            const lessonsNote = (envelope && envelope.lessons_note)
                || '以下为基于公开报道整理的借鉴点，非官方结论。';

            document.title = `${c.title} - 粤乡智匠`;

            main.innerHTML = `
                <div class="case-hero">
                    <div class="location-tag"><i class="fas fa-map-marker-alt"></i> ${c.location}</div>
                    <h1>${c.title}</h1>
                    <p class="subtitle">${c.description}</p>
                </div>

                ${stats.length > 0 ? `
                <div class="stats-grid">
                    ${stats.map(s => `
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas ${s.icon || 'fa-chart-line'}"></i></div>
                            <div class="stat-value">${s.value}</div>
                            <div class="stat-label">${s.label}</div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                <div class="content-card">
                    <h2><i class="fas fa-info-circle"></i> 案例背景</h2>
                    <div class="prose">${toParagraphs(c.background)}</div>
                </div>

                ${milestones.length > 0 ? `
                <div class="content-card">
                    <h2><i class="fas fa-route"></i> 关键节点</h2>
                    <div class="timeline">
                        ${milestones.map(m => `
                            <div class="timeline-item">
                                ${m.period ? `<div class="t-period">${m.period}</div>` : ''}
                                <div class="t-title">${m.title}</div>
                                <div class="t-desc">${m.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                ${hasQuote ? `
                <div class="quote-block">
                    <p>${c.quote}</p>
                    <div class="quote-author">—— ${c.quote_author}</div>
                </div>
                ` : ''}

                ${lessons.length > 0 ? `
                <div class="content-card">
                    <h2><i class="fas fa-lightbulb"></i> 借鉴与启示</h2>
                    <p class="section-note">${lessonsNote}</p>
                    <ul>
                        ${lessons.map(l => `<li>${l}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}

                ${sources.length > 0 ? `
                <div class="content-card case-sources">
                    <h2><i class="fas fa-book-open"></i> 资料来源</h2>
                    <p class="section-note">${sourceNote}</p>
                    <ul>
                        ${sources.map(s => `
                            <li>
                                <a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}</a>
                                <span class="src-meta">${s.media}${s.date ? ' · ' + s.date : ''}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
                ` : ''}

                <div style="text-align:center; margin-top:12px;">
                    <a href="index.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> 返回首页探索更多</a>
                </div>
            `;
        }

        function showError(title, msg) {
            main.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>${title}</h3>
                    <p>${msg}</p>
                    <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> 返回首页</a>
                </div>
            `;
        }
    })();
    </script>
</body>
</html>
