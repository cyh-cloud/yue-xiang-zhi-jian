# 提交前跑两个机械检查。装一次：pip install pre-commit && pre-commit install
#
# 两个检查都是纯标准库、零第三方依赖，所以即使没装 pre-commit 也能直接跑：
#   python tools/check_python.py
#   python tools/check_architecture.py
repos:
  - repo: local
    hooks:
      - id: check-python
        name: Python 静态检查（未用导入 / 未定义名）
        entry: python tools/check_python.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-architecture
        name: 架构机械检查（领域边界 / 行数上限）
        entry: python tools/check_architecture.py
        language: system
        pass_filenames: false
        types: [python]
